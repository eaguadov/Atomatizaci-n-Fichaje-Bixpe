name: Clock Out (End)

on:
  repository_dispatch:
    types: [clock_out]  # Triggered by cron-job.org
  workflow_dispatch:  # Manual trigger

jobs:
  clock-out:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Clock Out
        env:
          BIXPE_EMAIL: ${{ secrets.BIXPE_EMAIL }}
          BIXPE_PASSWORD: ${{ secrets.BIXPE_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          NOTIFY_ON_SUCCESS: ${{ vars.NOTIFICAR_EXITOS }}
        run: |
          echo "=== Starting Clock Out at $(date) ==="
          python src/bixpe_bot.py --action END --force
          echo "=== Finished Clock Out at $(date) ==="

      - name: Notificar a Healthchecks (Salida)
        if: success()
        env:
          HC_URL: ${{ secrets.HC_URL_END }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -fsS -m 10 --retry 5 -o /dev/null "$HC_URL"
            echo "Ping enviado a Healthchecks."
          else
            echo "HC_URL_END no está configurado. Omitiendo ping."
          fi

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-end-${{ github.run_id }}
          path: "*.png"
          retention-days: 7

      - name: Upload Debug Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-end-${{ github.run_id }}
          path: |
            *.html
            *.png
          retention-days: 7

      - name: Send Telegram Notification on Failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=⚠️ *ERROR EN FICHAJE BIXPE* ⚠️%0A%0A*Acción:* ${{ github.workflow }}%0A*Estado:* Falló ❌%0A*Repositorio:* ${{ github.repository }}%0A*Ejecución:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "parse_mode=Markdown"
          else
            echo "Telegram token or chat ID not set. Skipping Telegram alert."
          fi
