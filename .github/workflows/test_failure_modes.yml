name: TEST Failure Modes (Simular Errores)

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Elige el tipo de error a simular'
        required: true
        default: 'wrong_password'
        type: choice
        options:
          - wrong_password
          - wrong_url
          - missing_button

jobs:
  test-failure-modes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      # Modo de Error 1: Contraseña incorrecta
      - name: TEST Error 1 (Contraseña Incorrecta)
        if: ${{ inputs.test_type == 'wrong_password' }}
        env:
          BIXPE_EMAIL: ${{ secrets.BIXPE_EMAIL }}
          BIXPE_PASSWORD: "contrasena_falsa_de_prueba_123"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python src/bixpe_bot.py --action START --force

      # Modo de Error 2: URL errónea de Bixpe
      - name: TEST Error 2 (URL Errónea)
        if: ${{ inputs.test_type == 'wrong_url' }}
        env:
          BIXPE_EMAIL: ${{ secrets.BIXPE_EMAIL }}
          BIXPE_PASSWORD: ${{ secrets.BIXPE_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python src/bixpe_bot.py --action START --force --url "https://url-inexistente-bixpe-falsa.com/"

      # Modo de Error 3: Botón no encontrado en Bixpe
      - name: TEST Error 3 (Botón Inexistente)
        if: ${{ inputs.test_type == 'missing_button' }}
        env:
          BIXPE_EMAIL: ${{ secrets.BIXPE_EMAIL }}
          BIXPE_PASSWORD: ${{ secrets.BIXPE_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python src/bixpe_bot.py --action START --force --test-missing-button

      - name: Upload Debug Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-failure-${{ github.run_id }}
          path: |
            *.html
            *.png
          retention-days: 7

      - name: Send Telegram Notification on Failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=⚠️ *ERROR EN FICHAJE BIXPE (PRUEBA DE FALLO)* ⚠️%0A%0A*Acción:* ${{ github.workflow }}%0A*Tipo de Error:* ${{ inputs.test_type }}%0A*Estado:* Falló ❌%0A*Repositorio:* ${{ github.repository }}%0A*Ejecución:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "parse_mode=Markdown"
          else
            echo "Telegram token or chat ID not set. Skipping Telegram alert."
          fi
